<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Event Outreach — HansePay Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="admin.css" />
<style>
  .page-desc{font-size:.875rem;color:var(--ink3);margin-bottom:22px;max-width:680px}

  /* Upload card */
  .upload-card{border:1.5px dashed rgba(11,25,41,.18);border-radius:var(--r-lg);padding:24px;margin-bottom:28px;background:var(--n050)}
  .upload-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .upload-field{flex:1;min-width:200px}
  .upload-field label{font-size:.75rem;font-weight:600;color:var(--ink3);margin-bottom:5px;display:block}
  .upload-field input[type="text"]{width:100%;padding:9px 12px;border:1.5px solid rgba(11,25,41,.14);border-radius:var(--r-md);font-family:'Inter',sans-serif;font-size:.875rem}
  .file-input-wrap{flex:1;min-width:200px}
  .upload-status{margin-top:12px;font-size:.8125rem}

  /* Event list */
  .event-card{border:1px solid rgba(11,25,41,.1);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:border-color .15s}
  .event-card:hover{border-color:var(--n400)}
  .event-name{font-size:.9375rem;font-weight:600;color:var(--ink)}
  .event-meta{font-size:.75rem;color:var(--ink3);margin-top:4px}
  .event-stats{display:flex;gap:14px;font-size:.75rem;color:var(--ink2)}
  .event-stats b{color:var(--n600)}

  /* Queue view */
  .queue-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .back-link{font-size:.8125rem;color:var(--n500);cursor:pointer;font-weight:600}
  .progress-bar{height:6px;background:rgba(11,25,41,.08);border-radius:100px;overflow:hidden;margin-bottom:20px}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--n400),#16a34a);border-radius:100px;transition:width .3s}

  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .filter-btn{font-size:.75rem;font-weight:600;padding:6px 14px;border-radius:100px;border:1.5px solid rgba(11,25,41,.14);background:#fff;color:var(--ink2);cursor:pointer}
  .filter-btn.active{background:var(--n500);border-color:var(--n500);color:#fff}

  .tabs{display:flex;gap:4px;border-bottom:1.5px solid rgba(11,25,41,.08);margin-bottom:18px}
  .tab-btn{font-size:.8125rem;font-weight:600;padding:9px 16px;border:none;background:none;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1.5px}
  .tab-btn.active{color:var(--n600);border-bottom-color:var(--n500)}
  .tab-btn .count{color:var(--ink3);font-weight:500}

  .nav-arrows{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px}
  .nav-arrow-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(11,25,41,.14);background:#fff;color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem}
  .nav-arrow-btn:disabled{opacity:.35;cursor:default}
  .nav-position{font-size:.8125rem;color:var(--ink3);min-width:70px;text-align:center}

  .status-pill{font-size:.6875rem;font-weight:700;padding:4px 10px;border-radius:100px;white-space:nowrap}
  .status-sent{background:#D4F4DD;color:#166534}
  .status-skipped{background:#F1F1EF;color:var(--ink3)}
  .status-pending{background:#DBEAFE;color:#1e40af}

  .notes-label{font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin:14px 0 6px}
  textarea.notes-box{width:100%;min-height:60px;padding:10px 12px;border:1.5px solid rgba(11,25,41,.14);border-radius:var(--r-md);font-family:'Inter',sans-serif;font-size:.8125rem;color:var(--ink);resize:vertical;margin-bottom:10px}
  .undo-btn{background:#fff;border:1.5px solid rgba(11,25,41,.14);color:var(--ink2)}

  .lead-card{background:#fff;border:1px solid rgba(11,25,41,.1);border-radius:var(--r-lg);padding:24px;max-width:640px}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
  .contact-name{font-size:1.15rem;font-weight:700;margin:0 0 2px}
  .contact-title{font-size:.8125rem;color:var(--ink2);margin:0}
  .tier-badge{font-size:.6875rem;font-weight:700;padding:4px 10px;border-radius:100px;white-space:nowrap;margin-left:10px}
  .tier-a{background:#D4F4DD;color:#166534}
  .tier-b{background:#FFF3CD;color:#92400e}
  .company-desc{font-size:.8125rem;color:var(--ink2);line-height:1.55;margin-bottom:12px;padding:10px 12px;background:var(--n050);border-left:3px solid var(--n300);border-radius:0 8px 8px 0}
  .meta-row{display:flex;gap:12px;font-size:.6875rem;color:var(--ink3);margin-bottom:14px;flex-wrap:wrap}
  .reasoning{font-size:.75rem;color:var(--ink3);background:#F5F1EA;border-radius:8px;padding:10px 12px;margin-bottom:16px;line-height:1.5}
  .msg-label{font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-bottom:6px}
  textarea.msg-box{width:100%;min-height:140px;padding:12px 14px;border:1.5px solid rgba(11,25,41,.14);border-radius:var(--r-md);font-family:'Inter',sans-serif;font-size:.875rem;line-height:1.6;color:var(--ink);resize:vertical;margin-bottom:14px}
  .actions-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .actions-row .btn{flex:1;min-width:120px;text-align:center}
  .btn-linkedin{background:#0A66C2!important;color:#fff!important;border-color:#0A66C2!important}
  .btn-linkedin-search{background:#EBF4FB!important;color:#0A66C2!important;border-color:#0A66C2!important}
  .nav-row{display:flex;gap:10px;margin-top:16px}
  .btn-skip{flex:1}
  .btn-sent{flex:2;background:#16a34a!important;color:#fff!important;border-color:#16a34a!important}
  .done-screen{text-align:center;padding:60px 20px}
  .stats-strip{display:flex;justify-content:center;gap:20px;margin-top:20px;font-size:.8125rem;color:var(--ink3)}
  .stats-strip b{color:var(--ink)}
  .empty-state{text-align:center;padding:48px 24px;color:var(--ink3);font-size:.875rem;border:1.5px dashed rgba(11,25,41,.12);border-radius:var(--r-lg)}
</style>
</head>
<body>
<div id="hp-sidebar"></div>

<main class="main">
  <div class="topbar"><div class="page-title">Event Outreach</div></div>

  <div class="content">
    <p class="page-desc">Teilnehmerliste einer Konferenz oder Messe hochladen — wird automatisch gegen die ICP-Kriterien (Dokument 0) gescored. Als "gesendet" markierte Kontakte landen automatisch als Lead im CRM.</p>

    <div id="uploadSection" class="upload-card">
      <div class="upload-row">
        <div class="upload-field">
          <label>Event-Name</label>
          <input type="text" id="eventNameInput" placeholder="z. B. Bits &amp; Pretzels 2027">
        </div>
        <div class="file-input-wrap">
          <label style="font-size:.75rem;font-weight:600;color:var(--ink3);margin-bottom:5px;display:block">Teilnehmerliste (.xlsx, .csv)</label>
          <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
        </div>
        <button class="btn btn-primary" id="uploadBtn">Hochladen &amp; Scoren</button>
      </div>
      <div class="upload-status" id="uploadStatus"></div>
    </div>

    <div id="listView">
      <div class="muted" style="font-size:.8125rem;margin-bottom:14px" id="eventsCount">Loading…</div>
      <div id="eventsList"></div>
    </div>

    <div id="queueView" style="display:none"></div>

  </div>
</main>

<script src="components.js"></script>
<script>
HPAdmin.renderSidebar('crm');
var H = window.HPAdmin;
var A = H.authFetch, esc = H.escapeHtml;

var state = { view: 'list', currentImportId: null, leads: [], tierFilter: 'all', tab: 'pending', index: 0 };

function loadEvents(){
  A('/api/events').then(function(r){return r.json();}).then(function(events){
    document.getElementById('eventsCount').textContent = events.length + ' Event' + (events.length===1?'':'s') + ' importiert';
    var list = document.getElementById('eventsList');
    if(!events.length){
      list.innerHTML = '<div class="empty-state">Noch keine Teilnehmerliste hochgeladen — oben starten.</div>';
      return;
    }
    list.innerHTML = events.map(function(e){
      var date = new Date(e.createdAt).toLocaleDateString('de-DE', {day:'numeric',month:'short',year:'numeric'});
      return '<div class="event-card" onclick="openQueue(\'' + e.id + '\')">' +
        '<div><div class="event-name">' + esc(e.eventName) + '</div>' +
        '<div class="event-meta">' + date + ' · ' + e.totalRows + ' Teilnehmer importiert · von ' + esc(e.importedBy||'—') + '</div></div>' +
        '<div class="event-stats"><span><b>' + e.tierACount + '</b> Tier A</span><span><b>' + e.tierBCount + '</b> Tier B</span><span><b>' + e.scoredRows + '</b> mit Signal</span></div>' +
      '</div>';
    }).join('');
  });
}

document.getElementById('uploadBtn').addEventListener('click', function(){
  var eventName = document.getElementById('eventNameInput').value.trim();
  var fileInput = document.getElementById('fileInput');
  var statusEl = document.getElementById('uploadStatus');
  if(!eventName){ H.toast('Bitte Event-Namen eingeben', 'error'); return; }
  if(!fileInput.files.length){ H.toast('Bitte eine Datei auswählen', 'error'); return; }

  var fd = new FormData();
  fd.append('eventName', eventName);
  fd.append('file', fileInput.files[0]);

  var btn = document.getElementById('uploadBtn');
  btn.disabled = true; btn.textContent = 'Wird verarbeitet…';
  statusEl.textContent = 'Datei wird hochgeladen und gescored — das kann bei großen Listen einen Moment dauern…';
  statusEl.style.color = 'var(--ink3)';

  fetch('/api/events/upload', { method:'POST', headers: { 'Authorization': 'Bearer ' + localStorage.getItem('hp_token') }, body: fd })
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, data:d}; }); })
    .then(function(res){
      if(!res.ok){ statusEl.textContent = res.data.error || 'Fehler beim Verarbeiten'; statusEl.style.color = '#dc2626'; return; }
      statusEl.textContent = '✓ ' + res.data.totalRows + ' Teilnehmer importiert, ' + res.data.scoredRows + ' mit ICP-Signal (' + res.data.tierACount + ' Tier A, ' + res.data.tierBCount + ' Tier B).';
      statusEl.style.color = '#16a34a';
      document.getElementById('eventNameInput').value = '';
      fileInput.value = '';
      loadEvents();
    })
    .catch(function(){ statusEl.textContent = 'Fehler beim Verarbeiten'; statusEl.style.color = '#dc2626'; })
    .finally(function(){ btn.disabled = false; btn.textContent = 'Hochladen & Scoren'; });
});

window.openQueue = function(importId){
  state.currentImportId = importId;
  A('/api/events/' + importId + '/queue').then(function(r){return r.json();}).then(function(data){
    state.leads = data.leads;
    state.eventName = data.import.eventName;
    state.tierFilter = 'all';
    state.tab = 'pending';
    state.index = 0;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('uploadSection').style.display = 'none';
    document.getElementById('queueView').style.display = 'block';
    renderQueue();
  });
};

function backToList(){
  document.getElementById('listView').style.display = 'block';
  document.getElementById('uploadSection').style.display = 'block';
  document.getElementById('queueView').style.display = 'none';
  loadEvents();
}

function getTierFiltered(){
  if(state.tierFilter==='A') return state.leads.filter(function(l){return l.icpTier==='A';});
  if(state.tierFilter==='B') return state.leads.filter(function(l){return l.icpTier==='B';});
  return state.leads;
}
function getTabList(){
  var tf = getTierFiltered();
  if(state.tab==='all') return tf;
  return tf.filter(function(l){return l.status===state.tab;});
}

function renderQueue(){
  var tierFiltered = getTierFiltered();
  var tierACount = state.leads.filter(function(l){return l.icpTier==='A';}).length;
  var tierBCount = state.leads.filter(function(l){return l.icpTier==='B';}).length;
  var pendingCount = tierFiltered.filter(function(l){return l.status==='pending';}).length;
  var sentCount = tierFiltered.filter(function(l){return l.status==='sent';}).length;
  var skippedCount = tierFiltered.filter(function(l){return l.status==='skipped';}).length;
  var doneCount = sentCount + skippedCount;
  var pct = tierFiltered.length ? Math.round((doneCount/tierFiltered.length)*100) : 0;

  var list = getTabList();
  if(state.index >= list.length) state.index = Math.max(0, list.length - 1);

  var html = '<div class="queue-header">' +
    '<div><h2 style="font-family:Playfair Display,serif;font-weight:400;font-size:1.15rem;margin:0">' + esc(state.eventName) + '</h2></div>' +
    '<div style="display:flex;gap:14px;align-items:center">' +
    '<span class="back-link" onclick="regenerateMessages()" style="color:var(--ink3)">Nachrichten neu generieren</span>' +
    '<span class="back-link" onclick="backToList()">← Zurück zur Liste</span></div></div>' +
    '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="filters">' +
      '<button class="filter-btn' + (state.tierFilter==='all'?' active':'') + '" onclick="setTierFilter(\'all\')">Alle Tiers (' + state.leads.length + ')</button>' +
      '<button class="filter-btn' + (state.tierFilter==='A'?' active':'') + '" onclick="setTierFilter(\'A\')">Tier A (' + tierACount + ')</button>' +
      '<button class="filter-btn' + (state.tierFilter==='B'?' active':'') + '" onclick="setTierFilter(\'B\')">Tier B (' + tierBCount + ')</button>' +
    '</div>' +
    '<div class="tabs">' +
      '<button class="tab-btn' + (state.tab==='pending'?' active':'') + '" onclick="setTab(\'pending\')">Offen <span class="count">(' + pendingCount + ')</span></button>' +
      '<button class="tab-btn' + (state.tab==='sent'?' active':'') + '" onclick="setTab(\'sent\')">Gesendet <span class="count">(' + sentCount + ')</span></button>' +
      '<button class="tab-btn' + (state.tab==='skipped'?' active':'') + '" onclick="setTab(\'skipped\')">Übersprungen <span class="count">(' + skippedCount + ')</span></button>' +
      '<button class="tab-btn' + (state.tab==='all'?' active':'') + '" onclick="setTab(\'all\')">Alle <span class="count">(' + tierFiltered.length + ')</span></button>' +
    '</div>';

  if(!list.length){
    var emptyMsg = state.tab==='pending' ? 'Alle Kontakte in dieser Ansicht sind bearbeitet. 🎉'
      : state.tab==='sent' ? 'Noch niemand als gesendet markiert.'
      : state.tab==='skipped' ? 'Noch niemand übersprungen.' : 'Keine Kontakte in dieser Ansicht.';
    html += '<div class="done-screen"><h2 style="font-family:Playfair Display,serif;font-weight:400">' + (state.tab==='pending' ? 'Fertig!' : '—') + '</h2><p class="muted">' + emptyMsg + '</p></div>';
    document.getElementById('queueView').innerHTML = html;
    return;
  }

  html += '<div class="nav-arrows">' +
    '<button class="nav-arrow-btn" id="prevBtn" ' + (state.index<=0?'disabled':'') + '>←</button>' +
    '<span class="nav-position">' + (state.index+1) + ' / ' + list.length + '</span>' +
    '<button class="nav-arrow-btn" id="nextBtn" ' + (state.index>=list.length-1?'disabled':'') + '>→</button>' +
  '</div>';

  var c = list[state.index];
  var tierClass = c.icpTier==='A' ? 'tier-a' : 'tier-b';
  var oneLinerHtml = c.oneLiner ? '<div class="company-desc">🏢 ' + esc(c.oneLiner) + '</div>' : '';
  var metaBits = [];
  if(c.hq) metaBits.push('📍 ' + esc(c.hq));
  if(c.headcount) metaBits.push('👥 ' + esc(c.headcount));
  var metaHtml = metaBits.length ? '<div class="meta-row">' + metaBits.map(function(b){return '<span>'+b+'</span>';}).join('') + '</div>' : '';
  var linkedinBtn = c.linkedin
    ? '<a class="btn btn-linkedin" href="' + esc(c.linkedin) + '" target="_blank" rel="noopener">LinkedIn öffnen ↗</a>'
    : '<a class="btn btn-linkedin-search" href="' + esc(c.linkedinSearchUrl) + '" target="_blank" rel="noopener">🔍 Auf LinkedIn suchen ↗</a>';
  var websiteBtn = c.website ? '<a class="btn btn-ghost" href="' + esc(c.website.indexOf('http')===0?c.website:'https://'+c.website) + '" target="_blank" rel="noopener">Website ↗</a>' : '';

  var statusPillMap = { pending:'Offen', sent:'Gesendet', skipped:'Übersprungen' };
  var statusPill = '<span class="status-pill status-' + c.status + '">' + statusPillMap[c.status] + (c.statusAt ? ' · ' + new Date(c.statusAt).toLocaleDateString('de-DE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '') + '</span>';

  var actionButtons;
  if(c.status === 'pending'){
    actionButtons = '<div class="nav-row"><button class="btn btn-ghost btn-skip" onclick="markStatus(\'' + c.id + '\',\'skipped\')">Überspringen</button>' +
      '<button class="btn btn-sent" onclick="markStatus(\'' + c.id + '\',\'sent\')">✓ Gesendet — Lead im CRM anlegen</button></div>';
  } else {
    var crmLink = c.createdCustomerId ? '<a class="btn btn-ghost" href="crm.html?customer=' + c.createdCustomerId + '" target="_blank">Im CRM ansehen ↗</a>' : '';
    actionButtons = '<div class="nav-row">' + crmLink + '<button class="btn undo-btn" onclick="markStatus(\'' + c.id + '\',\'pending\')">↺ Zurück zu Offen</button></div>';
  }

  html += '<div class="lead-card">' +
    '<div class="card-top"><div><p class="contact-name">' + esc(c.firstName+' '+c.lastName) + '</p>' +
    '<p class="contact-title">' + esc(c.title||'') + ' · ' + esc(c.company||'') + '</p></div>' +
    '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="tier-badge ' + tierClass + '">Tier ' + esc(c.icpTier) + ' · ' + c.icpScore + 'p</span>' + statusPill + '</div></div>' +
    oneLinerHtml + metaHtml +
    '<div class="reasoning">🎯 ' + esc(c.icpReasoning||'') + '</div>' +
    '<div class="msg-label">Nachricht (bearbeitbar)</div>' +
    '<textarea class="msg-box" id="msgBox">' + esc(c.draftMessage||'') + '</textarea>' +
    '<div class="actions-row">' + linkedinBtn + websiteBtn + '<button class="btn btn-ghost" id="copyBtn">Kopieren</button></div>' +
    '<div class="notes-label">Notiz (z. B. Gesprächsergebnis)</div>' +
    '<textarea class="notes-box" id="notesBox" placeholder="z. B. angerufen, kein Interesse aktuell — in 3 Monaten nochmal">' + esc(c.notes||'') + '</textarea>' +
    '<button class="btn btn-ghost" id="saveNotesBtn" style="margin-bottom:14px">Notiz speichern</button>' +
    actionButtons +
  '</div>';

  document.getElementById('queueView').innerHTML = html;

  var copyBtn = document.getElementById('copyBtn');
  if(copyBtn){
    copyBtn.addEventListener('click', function(){
      navigator.clipboard.writeText(document.getElementById('msgBox').value).then(function(){
        copyBtn.textContent = 'Kopiert ✓';
        setTimeout(function(){ copyBtn.textContent = 'Kopieren'; }, 1800);
      });
    });
  }
  var prevBtn = document.getElementById('prevBtn');
  if(prevBtn) prevBtn.addEventListener('click', function(){ if(state.index>0){ state.index--; renderQueue(); } });
  var nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.addEventListener('click', function(){ if(state.index<list.length-1){ state.index++; renderQueue(); } });
  var saveNotesBtn = document.getElementById('saveNotesBtn');
  if(saveNotesBtn){
    saveNotesBtn.addEventListener('click', function(){
      var notesVal = document.getElementById('notesBox').value;
      A('/api/events/leads/' + c.id + '/notes', { method:'POST', body: JSON.stringify({notes: notesVal}) })
        .then(function(r){return r.json();})
        .then(function(updated){
          var lead = state.leads.find(function(l){return l.id===c.id;});
          if(lead) lead.notes = updated.notes;
          H.toast('Notiz gespeichert ✓');
        })
        .catch(function(){ H.toast('Konnte Notiz nicht speichern', 'error'); });
    });
  }
}

window.setTierFilter = function(f){ state.tierFilter = f; state.index = 0; renderQueue(); };
window.setTab = function(t){ state.tab = t; state.index = 0; renderQueue(); };

window.regenerateMessages = function(){
  if(!confirm('Nachrichtentext für alle ' + state.leads.length + ' Kontakte neu generieren? Status und Notizen bleiben erhalten.')) return;
  A('/api/events/' + state.currentImportId + '/regenerate-messages', { method:'POST' })
    .then(function(r){return r.json();})
    .then(function(){
      H.toast('Nachrichten aktualisiert ✓');
      openQueue(state.currentImportId);
    })
    .catch(function(){ H.toast('Konnte Nachrichten nicht aktualisieren', 'error'); });
};

window.markStatus = function(leadId, status){
  A('/api/events/leads/' + leadId + '/status', { method:'POST', body: JSON.stringify({status: status}) })
    .then(function(r){return r.json();})
    .then(function(updated){
      var lead = state.leads.find(function(l){return l.id===leadId;});
      if(lead){ lead.status = updated.status; lead.statusAt = updated.statusAt; lead.createdCustomerId = updated.createdCustomerId; }
      // After acting on the current card, jump to the next pending one automatically
      // (only when working the pending tab — other tabs stay put so review flows aren't disrupted).
      if(state.tab === 'pending') { /* index naturally points at the next item since this one leaves the list */ }
      else if(state.index > 0) state.index--;
      renderQueue();
      if(status==='sent') H.toast('Als Lead im CRM angelegt ✓');
      else if(status==='pending') H.toast('Zurück zu Offen gesetzt');
    })
    .catch(function(){ H.toast('Konnte Status nicht speichern', 'error'); });
};


loadEvents();
</script>
</body>
</html>
